name: driver-centos9

on:
  push:
    branches: [main]
    paths:
      - driver-centos9/**
      - .github/workflows/driver-centos9.yaml
  workflow_dispatch:
    inputs:
      driver_version:
        description: NVIDIA driver version (must exist as nvcr.io/nvidia/driver:<version>-rocky9)
        default: "595.91.07"
      kernels:
        description: Space-separated CentOS Stream kernel releases (uname -r without "5.14.0-" and ".x86_64")
        default: "741.el9 754.el9"

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/driver
  DRIVER_VERSION: ${{ inputs.driver_version || '595.91.07' }}
  KERNELS: ${{ inputs.kernels || '741.el9 754.el9' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # gpu-operator pulls <repository>/driver:<version>-centos9
      - uses: docker/build-push-action@v6
        with:
          context: driver-centos9
          platforms: linux/amd64
          push: true
          build-args: |
            DRIVER_VERSION=${{ env.DRIVER_VERSION }}
            KERNELS=${{ env.KERNELS }}
          tags: ${{ env.IMAGE }}:${{ env.DRIVER_VERSION }}-centos9
          cache-from: type=gha
          cache-to: type=gha,mode=max
